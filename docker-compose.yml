version: '3.8'
# This is a sample docker-compose file for setting up the application and PostgreSQL database.
# Generated by Gemini.
services:
  app:
    build: .
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - APP_PORT=3003
      - APP_SECRET=change_this_secret_in_production
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=jss_tax_db
      - POSTGRES_PORT=5432
      - POOL_MODE=transaction
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jss_tax_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the dummy data to initialize the database if needed
      # - ./utils/dummydata.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
